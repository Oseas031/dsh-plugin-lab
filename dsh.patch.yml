# dsh-plugin-lab — 开发者工具插件（lab.run）
# 挂载后该 profile 的所有会话都可用 lab.run 工具（开发 profile 用；生产 profile 慎装）。
- insert:
    - id: plugin-lab
      name: 'dsh-plugin-lab'
      config:
        # dshRoot / nodePath 默认自动发现；需要时显式覆盖：
        # dshRoot: 'C:/Users/you/AppData/Local/Programs/DeepSeek Harness/resources/app/dsh'
        # nodePath: 'C:/.../node.exe'
